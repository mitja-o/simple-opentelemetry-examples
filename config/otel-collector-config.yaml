receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  otlphttp/prometheus:
    endpoint: prometheus:9090/api/v1/otlp
  otlphttp/loki:
    endpoint: loki:3100/otlp
  otlphttp/tempo:
    endpoint: http://tempo:4318
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlphttp/tempo]
    metrics:
      receivers: [otlp]
      exporters: [otlphttp/prometheus]
    logs:
      receivers: [otlp]
      exporters: [otlphttp/loki]
