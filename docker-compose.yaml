version: "3.8"
services:
  collector:
    container_name: collector
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otelcol-contrib/otel-collector.yaml
    command:
      - --config=/etc/otelcol-contrib/otel-collector.yaml
    restart: always
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver

  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    volumes:
      - ./config/prometheus-config.yaml:/etc/prometheus/prometheus.yaml
      - prometheusdata:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --web.enable-remote-write-receiver
      - --web.enable-otlp-receiver
      - --enable-feature=exemplar-storage
      - --storage.tsdb.retention.time=15d
    restart: always
    ports:
      - "9090:9090"
    depends_on:
      - collector

  loki:
    container_name: loki
    restart: always
    image: grafana/loki:latest
    volumes:
      - lokidata:/loki
    ports:
      - "3100:3100"
    depends_on:
      - collector

  tempo:
    container_name: tempo
    restart: always
    image: grafana/tempo:latest
    volumes:
      - ./config/tempo-config.yaml:/etc/tempo.yaml
      - tempodata:/var/tempo
    command:
      - -config.file=/etc/tempo.yaml
    ports:
      - "3200:3200"

  grafana:
    container_name: grafana
    image: grafana/grafana
    restart: always
    volumes:
      - ./config/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  grafanadata:
  prometheusdata:
  lokidata:
  tempodata:
